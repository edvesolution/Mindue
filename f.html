<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Invito famiglia – Mindue</title>
<style>
:root{--p:#6C4DFF;--p2:#B14EF5;--t:#14142B;--s:#5E6282;--bg:#F5F6FB;--card:#fff;--soft:#EFEBFF}
@media (prefers-color-scheme:dark){:root{--t:#F2F2FA;--s:#A9ABC6;--bg:#12121C;--card:#1D1D2B;--soft:#2A2440}}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;background:var(--bg);color:var(--t);line-height:1.5}
main{max-width:440px;margin:0 auto;padding:28px 16px 40px}
header{display:flex;align-items:center;gap:10px;margin-bottom:22px}
header img{width:40px;height:40px;border-radius:12px}header b{font-size:20px}
.card{background:var(--card);border-radius:22px;padding:22px;box-shadow:0 8px 24px rgba(28,26,79,.08)}
h1{font-size:23px;margin:0 0 8px;line-height:1.25}
p{color:var(--s);margin:0 0 12px}
.code{background:var(--soft);border-radius:16px;padding:14px;text-align:center;font-size:24px;font-weight:900;letter-spacing:3px;color:var(--p);margin:14px 0}
.btn{display:flex;align-items:center;justify-content:center;width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:800;margin-top:12px;text-decoration:none;font-family:inherit}
.primary{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
.ghost{background:transparent;color:var(--p);border:2px solid var(--p);font-size:14px;padding:12px}
.stores{display:flex;gap:10px}.stores a{flex:1}
ol{color:var(--s);padding-left:20px;margin:8px 0 0}li{margin-bottom:6px}
</style>
</head>
<body>
<main>
  <header><img src="logo.png" alt=""><b>Mindue</b></header>
  <div class="card" id="box"></div>
</main>
<script>
var APP_STORE = 'https://apps.apple.com/app/id6817892781';
var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.evapps.mindue';
var L = {
  it:{h:'Sei stato invitato in una famiglia su Mindue',p:'Entrando vedrete tutti le stesse scadenze: bollette, documenti, auto, scuola.',open:'Apri in Mindue ed entra',steps:['Scarica Mindue gratis (link qui sotto).','Torna su questa pagina e tocca «Apri in Mindue», oppure in Mindue vai su Famiglia › «Ho un codice» e scrivi il codice.'],bad:'Questo link di invito non è valido.'},
  en:{h:'You’ve been invited to a family on Mindue',p:'Once you join, you’ll all see the same deadlines: bills, documents, car, school.',open:'Open in Mindue and join',steps:['Get Mindue for free (links below).','Come back here and tap “Open in Mindue”, or in Mindue go to Family › “I have a code” and type the code.'],bad:'This invite link is not valid.'},
  es:{h:'Te han invitado a una familia en Mindue',p:'Al unirte veréis todos los mismos vencimientos: facturas, documentos, coche, colegio.',open:'Abrir en Mindue y unirse',steps:['Descarga Mindue gratis (enlaces abajo).','Vuelve aquí y toca «Abrir en Mindue», o en Mindue ve a Familia › «Tengo un código» y escribe el código.'],bad:'Este enlace de invitación no es válido.'},
  fr:{h:'Tu as été invité dans une famille sur Mindue',p:'En la rejoignant, vous verrez tous les mêmes échéances : factures, papiers, voiture, école.',open:'Ouvrir dans Mindue et rejoindre',steps:['Télécharge Mindue gratuitement (liens ci-dessous).','Reviens ici et touche « Ouvrir dans Mindue », ou dans Mindue va dans Famille › « J’ai un code » et saisis le code.'],bad:'Ce lien d’invitation n’est pas valide.'},
  de:{h:'Du wurdest in eine Familie auf Mindue eingeladen',p:'Danach seht ihr alle dieselben Fristen: Rechnungen, Dokumente, Auto, Schule.',open:'In Mindue öffnen und beitreten',steps:['Lade Mindue kostenlos (Links unten).','Komm hierher zurück und tippe auf „In Mindue öffnen“ oder gehe in Mindue zu Familie › „Ich habe einen Code“ und gib den Code ein.'],bad:'Dieser Einladungslink ist ungültig.'}
};
var lang=(navigator.language||'it').slice(0,2); if(!L[lang]) lang='en'; var T=L[lang]; document.documentElement.lang=lang;
var m=location.hash.match(/c=([A-Za-z0-9-]+)/); var c=m?m[1].toUpperCase().replace(/[^A-Z0-9]/g,''):'';
var box=document.getElementById('box');
if(!/^[A-HJ-NP-Z2-9]{12}$/.test(c)){ box.innerHTML='<p>'+T.bad+'</p>'; }
else {
  var pretty=c.replace(/(.{4})(?=.)/g,'$1-');
  box.innerHTML='<h1>'+T.h+'</h1><p>'+T.p+'</p><div class="code">'+pretty+'</div>'+
    '<a class="btn primary" href="mindue://family?c='+c+'">'+T.open+'</a>'+
    '<ol>'+T.steps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol>'+
    '<div class="stores"><a class="btn ghost" href="'+APP_STORE+'">App Store</a><a class="btn ghost" href="'+PLAY_STORE+'">Google Play</a></div>';
}
</script>
</body>
</html>
